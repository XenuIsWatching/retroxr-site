# The rendezvous is deployed on request, never on a push.
#
# deploy.yml publishes the site on every push to main. If this lived there, a
# devlog post would restart the server people are playing through.
#
# Authentication is keyless. GitHub mints an OIDC token, Google exchanges it for
# a short-lived credential, and the identity is pinned to this repository by an
# attribute condition on the provider - so there is no service-account key to
# leak, rotate, or find in a public repo. SSH goes through IAP rather than a
# public port 22, which is why no address appears here either.
#
# The service account also needs iam.serviceAccountUser on the INSTANCE service
# account, not only its own project roles: reaching a VM that runs as a service
# account means acting as it, and without that scp fails before sshd is reached.
name: Deploy rendezvous

on:
  workflow_dispatch:

env:
  GCP_PROJECT: retroxr-rendezvous
  GCE_INSTANCE: rendezvous
  GCE_ZONE: us-west1-b

permissions:
  contents: read
  id-token: write   # required for the OIDC token; without it auth fails

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No dependencies, so there is nothing to install and the self-test is the
      # whole gate. It runs before anything is allowed near the live box.
      - run: node server/registry.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/557677039441/locations/global/workloadIdentityPools/github/providers/retroxr-site
          service_account: gh-deploy@retroxr-rendezvous.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Ship the checkout rather than pulling on the box: the server lives in a
      # subdirectory of a site repo, and a clone there would drag the whole site
      # onto a machine that has no business holding it.
      #
      # Into the home directory, not /tmp. OS Login gives each identity its own
      # POSIX user, /tmp is sticky, and a file left there by a human cannot be
      # overwritten by the deploy account - which fails as a bare "permission
      # denied" long after the interesting part has already worked.
      - name: Copy server/ to the instance
        run: |
          tar czf /tmp/server.tgz server
          gcloud compute scp /tmp/server.tgz \
            "${GCE_INSTANCE}:~/server.tgz" \
            --zone="${GCE_ZONE}" --project="${GCP_PROJECT}" --tunnel-through-iap --quiet

      - name: Rebuild and restart
        run: |
          gcloud compute ssh "${GCE_INSTANCE}" \
            --zone="${GCE_ZONE}" --project="${GCP_PROJECT}" --tunnel-through-iap --quiet \
            --command='set -euo pipefail
              rm -rf ~/rendezvous && mkdir -p ~/rendezvous
              tar xzf ~/server.tgz -C ~/rendezvous --strip-components=1
              cd ~/rendezvous
              sudo docker compose up -d --build
              sudo docker compose ps'

      # A deploy that leaves the registry dead should fail loudly rather than
      # report success. This is the same endpoint the client asks for first.
      # Both halves, because they fail independently. An outage on 2026-08-25
      # had noray silently ignoring every command while the registry answered
      # perfectly - and this step, which then checked only the registry, went
      # green straight through it.
      - name: Verify the registry came back
        run: |
          sleep 10
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 https://net.retroxr.app/v1/health; then
              echo; echo "registry healthy"; exit 0
            fi
            echo "attempt $i failed, retrying"; sleep 10
          done
          echo "registry did not come back healthy"; exit 1

      # Speak the protocol. A port knock is not a check: noray accepted TCP
      # connections throughout that outage and simply never replied.
      - name: Verify noray answers the protocol
        run: |
          for i in 1 2 3 4 5; do
            reply=$(printf 'register-host\n' | timeout 10 nc punch.retroxr.app 8890 | head -c 200 || true)
            case "$reply" in
              set-oid*) echo "noray healthy: $(echo "$reply" | head -1)"; exit 0 ;;
            esac
            echo "attempt $i: no set-oid yet, retrying"; sleep 10
          done
          echo "noray did not answer register-host - the punch server is down"
          exit 1
