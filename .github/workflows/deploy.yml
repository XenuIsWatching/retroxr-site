name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, and mint the OIDC token
# actions/deploy-pages authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued rather than cancelled so a merge train still
# publishes its last commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The clips under public/video are Git LFS objects. Without lfs: true the
      # build ships their pointer files as .mp4 and every player is broken.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
